<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tadarruj icon">
  <title>Tadarruj</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8cf8"/>
      <stop offset="100%" stop-color="#1e46c0"/>
    </linearGradient>
  </defs>

  <!-- Bar 1 (shortest) -->
  <rect x="10" y="57" width="18" height="26" rx="3" fill="url(#g)"/>

  <!-- Bar 2 (medium) -->
  <rect x="36" y="42" width="18" height="41" rx="3" fill="url(#g)"/>

  <!-- T crossbar -->
  <rect x="53" y="18" width="37" height="10" rx="3" fill="url(#g)"/>

  <!-- Bar 3 / T stem (tallest) -->
  <rect x="62" y="18" width="18" height="65" rx="3" fill="url(#g)"/>
</svg>
